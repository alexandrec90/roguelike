<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tree Lab · Roguelike</title>
  </head>
  <body>
    <div class="lab">
      <aside class="catalog">
        <h1>Tree Lab</h1>
        <p class="blurb">
          Eight procedural mechanisms, one wind field. Click a species to show it alone.
        </p>
        <nav id="species"></nav>
        <footer>
          <p><kbd>space</kbd> play · <kbd>esc</kbd> show all · <kbd>[</kbd><kbd>]</kbd> zoom</p>
        </footer>
      </aside>

      <main class="stage">
        <div class="toolbar">
          <div class="group">
            <button type="button" id="play">Pause</button>
            <label for="speed">Speed</label>
            <input type="range" id="speed" min="0.1" max="2" step="0.1" />
            <span class="readout" id="clock">0.0 s</span>
          </div>

          <div class="group">
            <label for="wind">Wind</label>
            <input type="range" id="wind" min="0" max="2.5" step="0.05" />
            <label for="gust">Gust</label>
            <input type="range" id="gust" min="0" max="1" step="0.05" />
          </div>

          <div class="group">
            <label for="light">Light</label>
            <input type="range" id="light" min="0" max="359" step="1" />
            <label for="sun">Sun</label>
            <input type="range" id="sun" min="0.15" max="1" step="0.05" />
          </div>

          <div class="group">
            <label for="rain">Rain</label>
            <input type="range" id="rain" min="0" max="1" step="0.05" />
            <label for="snow">Snow</label>
            <input type="range" id="snow" min="0" max="1" step="0.05" />
            <button type="button" id="ignite" title="Set the burnable bodies alight">Ignite</button>
          </div>

          <div class="group">
            <label for="distance">Rows away</label>
            <input type="range" id="distance" min="0" max="30" step="1" />
          </div>

          <div class="group">
            <label for="ground">Ground</label>
            <select id="ground"></select>
            <label for="zoom">Zoom</label>
            <select id="zoom"></select>
            <label for="seed">Seed</label>
            <input type="number" id="seed" step="1" />
          </div>

          <div class="group">
            <label class="check"><input type="checkbox" id="shadow" /> Shadow</label>
            <label class="check"><input type="checkbox" id="reflect" /> Reflection</label>
          </div>
        </div>

        <div class="viewport"><canvas id="canvas"></canvas></div>

        <div class="status">
          <p id="status" class="metrics"></p>
          <p id="notes" class="notes"></p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/trees/main.ts"></script>
  </body>
</html>
